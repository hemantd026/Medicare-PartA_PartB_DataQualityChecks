name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate synthetic demo data
        run: python examples/generate_sample_data.py

      - name: Run test suite
        env:
          PYSPARK_PYTHON: python
        run: pytest tests/ -q

      - name: Run end-to-end demo
        env:
          PYSPARK_PYTHON: python
        run: python examples/run_medicare_checks.py --out /tmp/reports
